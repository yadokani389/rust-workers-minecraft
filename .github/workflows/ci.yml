name: Minecraft on WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/worker-build
          key: minecraft-toolchain-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/setup.sh') }}
      - name: Setup pinned sources, toolchain and Worker dependencies
        run: nix develop --command bash scripts/setup.sh
      - name: Worker TCP and WebSocket, shared world, and SQLite restart
        run: |
          set -o pipefail
          nix develop --command pnpm test 2>&1 | tee smoke.log
          grep -q 'PUMPKIN-DO-SQLITE-RESTART-OK' smoke.log
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-smoke-log
          path: |
            smoke.log
            .data/probes/workers.*/*.log
          if-no-files-found: ignore
